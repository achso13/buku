services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      MONGO_URI: mongodb://mongo:27017/buku
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: npm run dev
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  web_node_modules:
  web_next: